<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1a3a;--surface:#ffffff;--surface2:#f3f7ff;--text:#1a202c;--text2:#4a5568;--text3:#718096;
    --green:#22c55e;--green-bg:#f0fdf4;--green-border:#bbf7d0;--yellow:#f59e0b;--yellow-bg:#fffbeb;--yellow-border:#fde68a;
    --red:#ef4444;--red-bg:#fef2f2;--red-border:#fecaca;--blue:#2577ea;--blue-bg:#eef4ff;--blue-border:#c8dcff;
    --radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.08);--font:'DM Sans',sans-serif;--font-display:'DM Serif Display',serif;
  }
  body{
    font-family:var(--font);
    background:
      radial-gradient(circle at 10% 5%, rgba(53,130,255,0.35), transparent 28%),
      radial-gradient(circle at 90% 20%, rgba(8,210,255,0.22), transparent 24%),
      linear-gradient(160deg,#081530,#0d2f72);
    color:var(--text);
    min-height:100vh;
    font-size:15px
  }
  .screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}
  .topbar{
    background:rgba(255,255,255,0.96);
    border-bottom:1px solid #dbe7ff;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10
  }
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;color:#1e3a8a}
  .logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#2577ea,#5da3ff);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:#1e3a8a;background:var(--surface2);padding:6px 12px;border-radius:20px;border:1px solid #d6e6ff;cursor:pointer}
  .user-chip:hover{background:#edf2f7}.user-dot{width:8px;height:8px;background:var(--green);border-radius:50%}
  .container{max-width:560px;margin:0 auto;padding:24px 16px;width:100%}
  .card{
    background:var(--surface);
    border-radius:18px;
    box-shadow:0 10px 28px rgba(8,34,84,.18);
    border:1px solid #dce8ff;
    overflow:hidden
  }
  .card-header{padding:24px 24px 0}.card-body{padding:20px 24px 24px}
  h1{font-family:var(--font-display);font-size:28px;font-weight:400;line-height:1.2;margin-bottom:6px}
  h2{font-size:18px;font-weight:600;margin-bottom:4px}.subtitle{font-size:14px;color:var(--text2);margin-bottom:24px}
  .field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea{
    width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-family:var(--font);font-size:15px;color:var(--text);background:var(--surface);transition:border-color .15s;outline:none
  }
  input:focus,textarea:focus{border-color:var(--blue)}textarea{resize:vertical;min-height:90px}
  .btn{width:100%;padding:13px;border-radius:10px;border:none;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:linear-gradient(135deg,#2577ea,#5ca5ff);color:#fff}.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1.5px solid #e2e8f0}.btn-secondary:hover{background:#edf2f7}
  .toggle-link{text-align:center;margin-top:16px;font-size:13px;color:var(--text3)}.toggle-link span{color:var(--blue);cursor:pointer;font-weight:500}
  .error,.success{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
  .error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a}
  .severity-slider{width:100%;margin:8px 0 4px;accent-color:var(--blue);height:6px}
  .severity-display{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .severity-badge{font-size:24px;font-weight:700;padding:4px 16px;border-radius:10px;transition:all .3s}
  .sev-mild{background:var(--green-bg);color:#16a34a;border:2px solid var(--green-border)}
  .sev-moderate{background:var(--yellow-bg);color:#b45309;border:2px solid var(--yellow-border)}
  .sev-severe{background:#fff7ed;color:#c2410c;border:2px solid #fed7aa}
  .sev-emergency{background:var(--red-bg);color:#dc2626;border:2px solid var(--red-border)}
  .sev-label{font-size:12px;color:var(--text3);font-weight:500}
  .result-banner{border-radius:var(--radius) var(--radius) 0 0;padding:20px 24px;display:flex;align-items:center;gap:14px}
  .result-banner.normal{background:linear-gradient(135deg,#e8fff1,#f5fffa);border-bottom:2px solid var(--green-border)}
  .result-banner.severe{background:linear-gradient(135deg,#fff6e8,#fffaf0);border-bottom:2px solid #fed7aa}
  .result-banner.emergency{background:linear-gradient(135deg,#fff0f0,#fff6f6);border-bottom:2px solid var(--red-border)}
  .section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:20px 0 10px;padding:0 24px}
  .item-card{margin:0 16px 10px;border-radius:12px;border:1.5px solid #dbe7ff;padding:14px 16px;background:var(--surface2)}
  .item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}.item-name{font-weight:600;font-size:14px}
  .item-tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
  .tag-green{background:var(--green-bg);color:#16a34a}.tag-blue{background:var(--blue-bg);color:#2563eb}.tag-red{background:var(--red-bg);color:#dc2626}.tag-yellow{background:var(--yellow-bg);color:#92400e}
  .item-detail{font-size:12px;color:var(--text2);margin-top:2px}.item-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .call-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;text-decoration:none;font-family:var(--font)}
  .call-btn-green{background:var(--green-bg);color:#16a34a;border:1px solid var(--green-border)}
  .call-btn-blue{background:var(--blue-bg);color:#1d4ed8;border:1px solid var(--blue-border)}
  .call-btn-red{background:var(--red-bg);color:#dc2626;border:1px solid var(--red-border)}
  .sos-banner{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;border-radius:12px;padding:16px;margin:0 16px 12px;text-align:center}
  .sos-numbers{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  .sos-num{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
  .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scroll-area{overflow-y:auto;flex:1}.pb-safe{padding-bottom:32px}
</style>
</head>
<body>
<div id="screen-auth" class="screen active">
  <div class="container" style="justify-content:center;display:flex;flex-direction:column;min-height:100vh">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:60px;height:60px;background:linear-gradient(135deg,#2577ea,#5ca5ff);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px">🏥</div>
      <h1 style="margin-bottom:6px;color:#fff">CareSync Style CareAI</h1>
      <p style="color:#c7dcff;font-size:15px">Modern healthcare experience</p>
    </div>
    <div class="card">
      <div class="card-header"><h2 id="auth-title">Welcome back</h2><p class="subtitle" id="auth-sub">Sign in to your account</p></div>
      <div class="card-body">
        <div id="err-box" class="error"></div>
        <div id="ok-box" class="success"></div>
        <div id="name-field" class="field" style="display:none"><label>Full Name</label><input type="text" id="inp-name" placeholder="Your name"></div>
        <div class="field"><label>Email Address</label><input type="email" id="inp-email" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input type="password" id="inp-pass" placeholder="••••••••"></div>
        <button class="btn btn-primary" onclick="handleAuth()" id="auth-btn"><span id="auth-btn-text">Sign In</span></button>
        <div class="toggle-link"><span id="toggle-mode" onclick="toggleAuthMode()">Don't have an account? Register</span></div>
      </div>
    </div>
  </div>
</div>
<div id="screen-problem" class="screen">
  <div class="topbar"><div class="logo"><div class="logo-icon">🏥</div>CareAI</div><div class="user-chip" onclick="logout()"><div class="user-dot"></div><span id="topbar-name">User</span>&nbsp;·&nbsp;Sign out</div></div>
  <div class="scroll-area"><div class="container">
    <div style="margin-bottom:24px;padding-top:8px"><h1 style="color:#fff">How are you feeling?</h1><p class="subtitle" style="color:#d6e7ff">Tell your symptoms and triage details</p></div>
    <div class="card"><div class="card-body" style="padding-top:24px">
      <div id="prob-err" class="error"></div>
      <div class="field"><label>Preferred language</label><input type="text" id="inp-lang" placeholder="English / Kannada / Hindi"></div>
      <div class="field"><label>Current body temperature (°C)</label><input type="number" id="inp-temp" min="30" max="45" step="0.1" placeholder="37.2"></div>
      <div class="field"><label>Describe your problem or symptoms</label><textarea id="inp-problem" placeholder="E.g. severe headache, fever and weakness"></textarea></div>
      <div class="field">
        <label>Rate symptom intensity</label><input type="range" class="severity-slider" id="sev-slider" min="1" max="10" value="5" oninput="updateSeverity(this.value)">
        <div class="severity-display"><span class="sev-label">1 = Mild</span><div class="severity-badge sev-mild" id="sev-badge">5</div><span class="sev-label">10 = Critical</span></div>
        <div style="text-align:center;margin-top:10px;font-size:13px;color:var(--text2)" id="sev-text">Moderate discomfort</div>
      </div>
      <div class="field">
        <label>Manual location (optional fallback)</label>
        <div style="display:flex;gap:8px;">
          <input type="number" id="inp-lat" step="0.000001" placeholder="Latitude (e.g. 12.9716)">
          <input type="number" id="inp-lng" step="0.000001" placeholder="Longitude (e.g. 77.5946)">
        </div>
      </div>
      <div class="field"><label>Location access for nearby services</label><button class="btn btn-secondary" onclick="getLocation()" id="loc-btn">📍 Use My Current Location</button><div id="loc-status" style="font-size:12px;color:var(--text3);margin-top:8px"></div></div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="analyzeSymptoms()">Analyze My Symptoms →</button>
    </div></div>
  </div></div>
</div>
<div id="screen-results" class="screen">
  <div class="topbar"><div class="logo"><div class="logo-icon">🏥</div>CareAI</div><div class="user-chip" onclick="logout()"><div class="user-dot"></div><span id="topbar-name2">User</span>&nbsp;·&nbsp;Sign out</div></div>
  <div class="scroll-area"><div id="results-content" class="pb-safe"></div></div>
</div>
<script>
let currentUser = null;
let userLat = null;
let userLng = null;
let isLogin = true;
let authToken = localStorage.getItem("careai_token") || "";

async function api(path, method = "GET", body = null, auth = false) {
  const headers = { "Content-Type": "application/json" };
  if (auth && authToken) headers.Authorization = "Bearer " + authToken;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || "Request failed");
  return data;
}
function setError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}
function setSuccess(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}
function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function toggleAuthMode() {
  isLogin = !isLogin;
  document.getElementById("auth-title").textContent = isLogin ? "Welcome back" : "Create Account";
  document.getElementById("auth-sub").textContent = isLogin ? "Sign in to your account" : "Join CareAI today";
  document.getElementById("auth-btn-text").textContent = isLogin ? "Sign In" : "Create Account";
  document.getElementById("toggle-mode").textContent = isLogin ? "Don't have an account? Register" : "Already have an account? Sign In";
  document.getElementById("name-field").style.display = isLogin ? "none" : "block";
  setError("err-box", "");
  setSuccess("ok-box", "");
}
async function handleAuth() {
  const email = document.getElementById("inp-email").value.trim();
  const pass = document.getElementById("inp-pass").value.trim();
  const name = document.getElementById("inp-name").value.trim();
  if (!email || !pass || (!isLogin && !name)) {
    setError("err-box", "Please fill in all required fields");
    return;
  }
  setError("err-box", "");
  setSuccess("ok-box", "");
  const btn = document.getElementById("auth-btn");
  btn.innerHTML = '<div class="spinner"></div>';
  btn.disabled = true;
  try {
    const out = isLogin
      ? await api("/api/auth/login", "POST", { email, password: pass })
      : await api("/api/auth/register", "POST", { name, email, password: pass });
    authToken = out.token;
    currentUser = out.user;
    localStorage.setItem("careai_token", authToken);
    document.getElementById("topbar-name").textContent = currentUser.name.split(" ")[0];
    document.getElementById("topbar-name2").textContent = currentUser.name.split(" ")[0];
    showScreen("screen-problem");
    if (!isLogin) setSuccess("ok-box", "Registration successful.");
  } catch (e) {
    setError("err-box", e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span id="auth-btn-text">' + (isLogin ? "Sign In" : "Create Account") + "</span>";
  }
}
function logout() {
  authToken = "";
  currentUser = null;
  localStorage.removeItem("careai_token");
  showScreen("screen-auth");
}
function updateSeverity(v) {
  v = parseInt(v, 10);
  const badge = document.getElementById("sev-badge");
  const text = document.getElementById("sev-text");
  badge.textContent = v;
  badge.className = "severity-badge";
  if (v <= 5) { badge.classList.add("sev-mild"); text.textContent = "Normal range"; }
  else if (v <= 8) { badge.classList.add("sev-severe"); text.textContent = "Severe range"; }
  else { badge.classList.add("sev-emergency"); text.textContent = "Emergency range"; }
}
function getLocation() {
  const btn = document.getElementById("loc-btn");
  const status = document.getElementById("loc-status");
  btn.textContent = "Locating...";
  btn.disabled = true;
  const fallbackLat = 12.9716;
  const fallbackLng = 77.5946;
  function applyFallback(msg) {
    userLat = fallbackLat;
    userLng = fallbackLng;
    document.getElementById("inp-lat").value = String(fallbackLat);
    document.getElementById("inp-lng").value = String(fallbackLng);
    status.textContent = msg + " Using default Bangalore location.";
    btn.textContent = "✓ Default Location Set";
    btn.disabled = false;
  }
  if (!navigator.geolocation) {
    applyFallback("Geolocation unavailable.");
    return;
  }
  navigator.geolocation.getCurrentPosition((pos) => {
    userLat = Number(pos.coords.latitude.toFixed(6));
    userLng = Number(pos.coords.longitude.toFixed(6));
    document.getElementById("inp-lat").value = String(userLat);
    document.getElementById("inp-lng").value = String(userLng);
    status.textContent = "Location captured: " + userLat + ", " + userLng;
    btn.textContent = "✓ Location Set";
    btn.disabled = false;
  }, () => {
    applyFallback("Unable to fetch location.");
  }, { enableHighAccuracy: true, timeout: 10000 });
}
function showLoading() {
  document.getElementById("results-content").innerHTML =
    '<div class="item-card" style="margin-top:16px">Analyzing symptoms...</div>';
}
function buildResults(data, problem, severity) {
  const cls = String(data.severity || "").toLowerCase();
  const title = data.severity === "Emergency" ? "EMERGENCY - Immediate Help Needed" :
    data.severity === "Severe" ? "Severe - Doctor Consultation Needed" :
      "Normal - Tablet Guidance";
  let html = '<div class="result-banner ' + cls + '"><span style="font-size:32px">' + (cls === "emergency" ? "🚨" : cls === "severe" ? "⚠️" : "✅") + '</span><div><div style="font-size:18px;font-weight:700">' + title + '</div><div style="font-size:13px;margin-top:2px">' + (data.advice || "") + '</div></div></div>';
  html += '<div class="section-label">Assessment Summary</div><div class="item-card"><div class="item-detail">Problem: ' + problem + '</div><div class="item-detail">Intensity: ' + severity + '/10</div><div class="item-detail">Language: ' + (data.preferredLanguage || "N/A") + '</div><div class="item-detail">Body temperature: ' + (data.bodyTemperature ?? "N/A") + ' C</div></div>';
  if (Array.isArray(data.medicines) && data.medicines.length) {
    html += '<div class="section-label">Suggested OTC Tablets</div>';
    data.medicines.forEach((m) => {
      html += '<div class="item-card"><div class="item-top"><div class="item-name">💊 ' + m.name + '</div><span class="item-tag tag-green">OTC</span></div><div class="item-detail">Usage: ' + m.usage + '</div><div class="item-detail">Dosage: ' + m.dosage + '</div></div>';
    });
  }
  if (Array.isArray(data.doctors) && data.doctors.length) {
    html += '<div class="section-label">Nearby Doctors</div>';
    data.doctors.forEach((d) => {
      html += '<div class="item-card"><div class="item-top"><div class="item-name">👨‍⚕️ ' + d.name + '</div><span class="item-tag tag-blue">' + d.specialization + '</span></div><div class="item-detail">Hospital: ' + d.hospital + '</div><div class="item-detail">Distance: ' + d.distance_km + ' km</div><div class="item-actions"><a class="call-btn call-btn-green" href="tel:' + d.phone + '">📞 Call Doctor</a></div></div>';
    });
  }
  if (Array.isArray(data.hospitals) && data.hospitals.length) {
    html += '<div class="section-label">Nearby Hospitals</div>';
    data.hospitals.forEach((h) => {
      html += '<div class="item-card"><div class="item-top"><div class="item-name">🏥 ' + h.name + '</div><span class="item-tag tag-yellow">' + h.distance_km + ' km</span></div><div class="item-detail">' + h.address + '</div><div class="item-actions"><a class="call-btn call-btn-blue" href="tel:' + h.contact + '">📞 Call Hospital</a></div></div>';
    });
  }
  if (Array.isArray(data.ambulances) && data.ambulances.length) {
    html += '<div class="section-label">Nearby Ambulance Services</div>';
    data.ambulances.forEach((a) => {
      html += '<div class="item-card"><div class="item-top"><div class="item-name">🚑 ' + a.service_name + '</div><span class="item-tag tag-red">' + a.distance_km + ' km</span></div><div class="item-actions"><a class="call-btn call-btn-red" href="tel:' + a.phone + '">📞 Call Now</a></div></div>';
    });
  }
  if (Array.isArray(data.emergencyNumbers) && data.emergencyNumbers.length) {
    html += '<div class="section-label">Emergency Numbers</div><div class="sos-banner"><div class="sos-numbers">';
    data.emergencyNumbers.forEach((n) => { html += '<a class="sos-num" href="tel:' + n + '">Call ' + n + '</a>'; });
    html += "</div></div>";
  }
  html += '<div style="padding:16px 16px 0"><button class="btn btn-secondary" onclick="showScreen(\'screen-problem\')">← New Assessment</button></div>';
  return html;
}
async function analyzeSymptoms() {
  const preferredLanguage = document.getElementById("inp-lang").value.trim();
  const bodyTemperature = Number(document.getElementById("inp-temp").value);
  const problem = document.getElementById("inp-problem").value.trim();
  const intensity = Number(document.getElementById("sev-slider").value);
  const manualLat = Number(document.getElementById("inp-lat").value);
  const manualLng = Number(document.getElementById("inp-lng").value);
  if (!preferredLanguage || !problem || !Number.isFinite(bodyTemperature)) {
    setError("prob-err", "Please fill preferred language, body temperature and problem.");
    return;
  }
  if (Number.isFinite(manualLat) && Number.isFinite(manualLng)) {
    userLat = manualLat;
    userLng = manualLng;
  }
  if (!Number.isFinite(userLat) || !Number.isFinite(userLng)) {
    userLat = 12.9716;
    userLng = 77.5946;
    document.getElementById("loc-status").textContent = "Location not available from browser. Using default Bangalore location.";
  }
  setError("prob-err", "");
  showScreen("screen-results");
  showLoading();
  try {
    const out = await api("/api/triage/submit", "POST", { preferredLanguage, problem, bodyTemperature, intensity, lat: userLat, lng: userLng }, true);
    document.getElementById("results-content").innerHTML = buildResults(out, problem, intensity);
  } catch (e) {
    document.getElementById("results-content").innerHTML = '<div class="item-card" style="margin-top:16px;color:#dc2626">' + e.message + "</div>";
  }
}
async function bootstrap() {
  updateSeverity(5);
  if (!authToken) return;
  try {
    const me = await api("/api/auth/me", "GET", null, true);
    currentUser = me.user;
    document.getElementById("topbar-name").textContent = currentUser.name.split(" ")[0];
    document.getElementById("topbar-name2").textContent = currentUser.name.split(" ")[0];
    showScreen("screen-problem");
  } catch {
    authToken = "";
    localStorage.removeItem("careai_token");
  }
}
document.getElementById("inp-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") handleAuth(); });
document.getElementById("inp-email").addEventListener("keydown", (e) => { if (e.key === "Enter") handleAuth(); });
bootstrap();
</script>
</body>
</html>
